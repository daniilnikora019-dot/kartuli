<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ქართული — тренажёр грузинского</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f7df3'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='system-ui'%3E%E1%83%A5%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ქართული">
<meta name="theme-color" content="#1f6b63" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav id="nav">
    <div class="brand">
      <div class="logo ka">ქ</div>
      <div><b>ქართული</b><span>тренажёр грузинского</span></div>
    </div>
    <button class="navbtn" data-go="home"><span class="ic">🏠</span><span class="t">Главная</span></button>
    <button class="navbtn" data-go="learn"><span class="ic">✨</span><span class="t">Новые слова</span><span class="badge" id="b-new"></span></button>
    <button class="navbtn" data-go="review"><span class="ic">🔄</span><span class="t">Повторение</span><span class="badge warn" id="b-due"></span></button>
    <button class="navbtn" data-go="cats"><span class="ic">🗂</span><span class="t">Категории</span></button>
    <button class="navbtn" data-go="dict"><span class="ic">📖</span><span class="t">Словарь</span></button>
    <button class="navbtn" data-go="alphabet"><span class="ic">🔤</span><span class="t">Алфавит</span></button>
    <button class="navbtn" data-go="stats"><span class="ic">📊</span><span class="t">Статистика</span></button>
    <div class="nav-foot">
      <button id="sound-btn" title="Автоозвучка">🔊</button>
      <button id="theme-btn" title="Тема">🌙</button>
      <button id="settings-btn" title="Настройки">⚙️</button>
    </div>
  </nav>
  <main id="main"><div class="empty"><div class="ico">⏳</div><h3>Загружаю словарь…</h3></div></main>
</div>
<script src="app.js"></script>
<script>
  // офлайн-режим работает на https и на localhost — по обычному http браузер его не разрешает
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
