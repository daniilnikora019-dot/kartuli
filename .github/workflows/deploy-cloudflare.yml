name: Публикация на Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить целостность словаря и озвучки
        run: python3 tools/check_build.py

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp index.html style.css app.js sw.js manifest.json robots.txt _site/
          cp -r icons data audio _site/
          rm -f _site/data/wod_history.json
          echo "файлов в сборке: $(find _site -type f | wc -l)"

      - name: Создать проект, если его ещё нет
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create kartuli --production-branch=main

      - name: Выложить на Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=kartuli --branch=main
